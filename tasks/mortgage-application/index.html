<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Циан · Короткая заявка на ипотеку</title>
    <style>
      :root {
        --cian: #0054fd;
        --cian-strong: #0043cd;
        --cian-soft: #e9efff;
        --ink: #171b1a;
        --muted: #69716e;
        --line: #e2e7e4;
        --surface: #ffffff;
        --canvas: #f4f6f5;
        --danger: #d64242;
        --glass: rgba(255, 255, 255, 0.52);
        --glass-strong: rgba(255, 255, 255, 0.72);
        --glass-border: rgba(255, 255, 255, 0.78);
        --shadow: 0 18px 46px rgba(21, 52, 112, 0.18);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 8%, rgba(0, 84, 253, 0.34), transparent 30rem),
          radial-gradient(circle at 91% 19%, rgba(154, 119, 255, 0.24), transparent 28rem),
          radial-gradient(circle at 45% 94%, rgba(72, 210, 194, 0.20), transparent 26rem),
          #e9eefb;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, Arial, sans-serif;
      }
      button, input { font: inherit; }
      button { cursor: pointer; }
      .stage { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 28px 18px; overflow: hidden; }
      .stage::before, .stage::after { content: ""; position: absolute; width: 270px; height: 270px; border-radius: 50%; filter: blur(12px); pointer-events: none; }
      .stage::before { top: 14%; left: calc(50% - 390px); background: rgba(255,255,255,.55); }
      .stage::after { right: calc(50% - 390px); bottom: 9%; background: rgba(113, 145, 255, .24); }
      .device {
        position: relative;
        z-index: 1;
        width: min(100%, 430px);
        min-height: 844px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--glass-border);
        border-radius: 34px;
        background: rgba(246, 249, 255, 0.46);
        backdrop-filter: blur(28px) saturate(132%);
        -webkit-backdrop-filter: blur(28px) saturate(132%);
        box-shadow: var(--shadow);
      }
      .topbar {
        padding: 18px 20px 10px;
        background: rgba(255,255,255,0.36);
        border-bottom: 1px solid rgba(255,255,255,.5);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      .brand-row { display: flex; align-items: center; justify-content: space-between; min-height: 28px; }
      .wordmark { color: var(--cian); font-size: 25px; font-weight: 750; letter-spacing: -1.3px; }
      .source-pill { color: #284fba; background: rgba(255,255,255,.58); border: 1px solid rgba(255,255,255,.9); box-shadow: 0 4px 10px rgba(24,64,150,.08); padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 650; }
      .progress-wrap { padding-top: 14px; }
      .progress-label { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; }
      .progress { height: 5px; margin-top: 8px; border: 1px solid rgba(255,255,255,.64); border-radius: 9px; background: rgba(255,255,255,.45); overflow: hidden; }
      .progress > span { display: block; height: 100%; width: 0; background: var(--cian); border-radius: inherit; transition: width 360ms cubic-bezier(.2,.8,.2,1); }
      main { flex: 1; display: flex; flex-direction: column; padding: 12px 20px 0; }
      .content { flex: 1; display: flex; flex-direction: column; }
      .screen { animation: reveal 420ms cubic-bezier(.2,.8,.2,1) both; }
      .screen.enter-forward { animation-name: enterForward; }
      .screen.enter-back { animation-name: enterBack; }
      .screen:not(.welcome-screen) > * { animation: childReveal 440ms cubic-bezier(.2,.8,.2,1) both; }
      .screen:not(.welcome-screen) > *:nth-child(1) { animation-delay: 20ms; }
      .screen:not(.welcome-screen) > *:nth-child(2) { animation-delay: 65ms; }
      .screen:not(.welcome-screen) > *:nth-child(3) { animation-delay: 110ms; }
      .screen:not(.welcome-screen) > *:nth-child(4) { animation-delay: 155ms; }
      .screen:not(.welcome-screen) > *:nth-child(5) { animation-delay: 200ms; }
      @keyframes reveal { from { opacity: 0; transform: translateY(13px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes enterForward { from { opacity: 0; transform: translate3d(22px, 0, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
      @keyframes enterBack { from { opacity: 0; transform: translate3d(-18px, 0, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
      @keyframes childReveal { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .eyebrow { color: var(--cian-strong); font-size: 14px; font-weight: 680; margin: 0 0 10px; }
      h1 { font-size: 31px; line-height: 1.1; letter-spacing: -1.15px; margin: 0; font-weight: 740; }
      h2 { font-size: 24px; line-height: 1.17; letter-spacing: -0.6px; margin: 0; font-weight: 720; }
      .lead { margin: 12px 0 0; color: var(--muted); line-height: 1.48; font-size: 16px; }
      .quest-panel { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 18px; padding:11px 13px; border:1px solid rgba(255,255,255,.8); border-radius:18px; background:linear-gradient(120deg,rgba(255,255,255,.66),rgba(231,238,255,.5)); box-shadow:0 8px 18px rgba(36,69,139,.08),inset 0 1px 0 rgba(255,255,255,.8); backdrop-filter:blur(15px); -webkit-backdrop-filter:blur(15px); }
      .quest-panel span { display:block; color:#5b6c98; font-size:11px; font-weight:680; }
      .quest-panel b { display:block; margin-top:2px; color:#1d3673; font-size:14px; letter-spacing:-.2px; }
      .quest-track { display:flex; gap:4px; }
      .quest-track i { width:8px; height:8px; border-radius:50%; background:rgba(87,111,171,.2); transition:background 180ms, transform 180ms; }
      .quest-track i.is-done { background:var(--cian); transform:scale(1.2); box-shadow:0 0 0 3px rgba(0,84,253,.1); }
      .estimate {
        margin-top: 25px;
        padding: 18px;
        background: linear-gradient(145deg, rgba(255,255,255,.72), rgba(225,235,255,.42));
        border: 1px solid rgba(255,255,255,.8);
        border-radius: 22px;
        box-shadow: 0 10px 24px rgba(26,68,150,.10);
        backdrop-filter: blur(17px) saturate(130%);
        -webkit-backdrop-filter: blur(17px) saturate(130%);
      }
      .estimate small { color: #50628e; font-size: 13px; }
      .estimate b { display: block; margin-top: 4px; font-size: 28px; letter-spacing: -0.8px; }
      .estimate p { margin: 7px 0 0; color: #50628e; font-size: 13px; line-height: 1.35; }
      .mini-benefits { display: grid; gap: 10px; margin-top: 22px; }
      .mini-benefit { display: flex; gap: 10px; align-items: center; color: #46514c; font-size: 14px; }
      .dot { width: 9px; height: 9px; flex: 0 0 9px; border-radius: 50%; background: var(--cian); box-shadow: 0 0 0 5px var(--cian-soft); }
      .form { margin-top: 25px; display: grid; grid-template-columns:1fr 1fr; gap: 11px; }
      .field { display: grid; gap: 7px; padding:13px; border:1px solid rgba(255,255,255,.78); border-radius:18px; background:rgba(255,255,255,.38); box-shadow:0 8px 17px rgba(39,68,128,.06),inset 0 1px 0 rgba(255,255,255,.7); backdrop-filter:blur(15px); -webkit-backdrop-filter:blur(15px); }
      .form .field:first-child { grid-column:1 / -1; }
      .field label { font-size: 14px; font-weight: 650; }
      .field input { width: 100%; border: 1px solid rgba(255,255,255,.86); border-radius: 14px; padding: 14px 14px; background: rgba(255,255,255,.54); color: var(--ink); outline: none; font-size: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.62); backdrop-filter: blur(13px); -webkit-backdrop-filter: blur(13px); transition: border-color 150ms, box-shadow 150ms, background 150ms; }
      .field input:focus { border-color: rgba(0,84,253,.72); background: rgba(255,255,255,.76); box-shadow: 0 0 0 4px rgba(0,84,253,0.13), inset 0 1px 0 rgba(255,255,255,.72); }
      .field input[readonly] { color: var(--muted); background: rgba(238,242,250,.64); }
      .hint { color: var(--muted); font-size: 12px; line-height: 1.35; }
      .error { color: var(--danger); font-size: 13px; min-height: 18px; }
      .choices { display: grid; gap: 10px; margin-top: 23px; }
      .choice {
        min-height: 60px;
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 14px 15px;
        color: var(--ink); text-align: left;
        background: rgba(255,255,255,.52); border: 1px solid rgba(255,255,255,.82); border-radius: 17px;
        box-shadow: 0 7px 16px rgba(40,66,119,.06), inset 0 1px 0 rgba(255,255,255,.7);
        backdrop-filter: blur(15px) saturate(125%); -webkit-backdrop-filter: blur(15px) saturate(125%);
        transition: transform 150ms, border-color 150ms, background 150ms, box-shadow 150ms;
      }
      .choice:hover { transform: translateY(-2px); box-shadow: 0 11px 22px rgba(40,66,119,.11), inset 0 1px 0 rgba(255,255,255,.8); }
      .choice[aria-pressed="true"] { border-color: rgba(0,84,253,.42); background: rgba(234,240,255,.64); box-shadow: 0 10px 23px rgba(0,84,253,.14), inset 0 1px 0 rgba(255,255,255,.85); animation: choiceSet 300ms cubic-bezier(.2,.9,.2,1); }
      .choices .choice:nth-child(4n + 1) { background:linear-gradient(135deg,rgba(255,226,203,.72),rgba(255,246,235,.46)); }
      .choices .choice:nth-child(4n + 2) { background:linear-gradient(135deg,rgba(207,235,255,.74),rgba(240,248,255,.44)); }
      .choices .choice:nth-child(4n + 3) { background:linear-gradient(135deg,rgba(225,216,255,.7),rgba(248,245,255,.46)); }
      .choices .choice:nth-child(4n + 4) { background:linear-gradient(135deg,rgba(210,244,230,.72),rgba(241,252,246,.46)); }
      .choices .choice[aria-pressed="true"], .choice-grid .chip[aria-pressed="true"] { background:linear-gradient(135deg,rgba(222,233,255,.88),rgba(245,248,255,.72)); }
      .choice > span { display: grid; min-width: 0; gap: 4px; }
      .choice > span > strong { display: block; color: var(--ink); font-size: 16px; font-weight: 650; line-height: 1.15; }
      .choice > span > span { display: block; color: var(--muted); font-size: 13px; line-height: 1.28; }
      .choice[aria-pressed="true"] .check { background: var(--cian); color: #fff; animation: checkPop 320ms cubic-bezier(.2,1.35,.2,1); }
      @keyframes choiceSet { 0% { transform: scale(.985); } 70% { transform: scale(1.012); } 100% { transform: scale(1); } }
      @keyframes checkPop { from { transform: scale(.45); } to { transform: scale(1); } }
      .check { width: 22px; height: 22px; display: grid; place-items: center; flex: 0 0 22px; border: 1px solid #cbd5d0; border-radius: 50%; color: transparent; font-size: 13px; font-weight: 800; }
      .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 23px; }
      .chip { min-height: 74px; border: 1px solid rgba(255,255,255,.82); border-radius: 18px; background: rgba(255,255,255,.52); color: var(--ink); box-shadow: 0 7px 16px rgba(40,66,119,.06), inset 0 1px 0 rgba(255,255,255,.7); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); text-align: left; padding: 12px; font-size: 15px; font-weight: 620; }
      .choice-grid .chip:nth-child(4n + 1) { background:linear-gradient(135deg,rgba(255,222,184,.74),rgba(255,247,232,.48)); }
      .choice-grid .chip:nth-child(4n + 2) { background:linear-gradient(135deg,rgba(202,231,255,.76),rgba(241,249,255,.48)); }
      .choice-grid .chip:nth-child(4n + 3) { background:linear-gradient(135deg,rgba(221,215,255,.74),rgba(248,246,255,.48)); }
      .choice-grid .chip:nth-child(4n + 4) { background:linear-gradient(135deg,rgba(202,244,224,.75),rgba(243,253,247,.48)); }
      .chip[aria-pressed="true"] { border-color: rgba(0,84,253,.42); background: rgba(234,240,255,.68); color: var(--cian-strong); animation: choiceSet 300ms cubic-bezier(.2,.9,.2,1); }
      .soft-note { margin-top: 18px; padding: 14px; border: 1px solid rgba(255,255,255,.78); border-radius: 15px; color: #4e5f8c; background: rgba(243,246,255,.54); box-shadow: inset 0 1px 0 rgba(255,255,255,.7); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font-size: 14px; line-height: 1.4; }
      .result-card { margin-top: 22px; padding: 17px; border: 1px solid rgba(255,255,255,.88); border-radius: 20px; background: linear-gradient(145deg, rgba(255,255,255,.70), rgba(223,233,255,.55)); box-shadow: 0 12px 26px rgba(0,84,253,.12), inset 0 1px 0 rgba(255,255,255,.8); backdrop-filter: blur(18px) saturate(130%); -webkit-backdrop-filter: blur(18px) saturate(130%); color: #264c9d; animation: resultIn 520ms cubic-bezier(.2,1.05,.2,1); }
      .result-card b { display: block; color: #153b8e; font-size: 18px; margin-bottom: 5px; }
      .result-card p { margin: 0; line-height: 1.4; font-size: 14px; }
      @keyframes resultIn { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .schedule-days { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 22px; }
      .day { min-height: 72px; border: 1px solid rgba(255,255,255,.82); border-radius: 15px; background: rgba(255,255,255,.52); box-shadow: 0 7px 15px rgba(40,66,119,.06), inset 0 1px 0 rgba(255,255,255,.7); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); color: var(--ink); padding: 9px 5px; }
      .day small, .day b { display: block; }
      .day small { color: var(--muted); font-size: 12px; }
      .day b { font-size: 16px; margin-top: 3px; }
      .day[aria-pressed="true"] { background: rgba(234,240,255,.68); border-color: rgba(0,84,253,.42); color: var(--cian-strong); }
      .slots { display: grid; gap: 9px; margin-top: 13px; }
      .slot { min-height: 49px; padding: 0 14px; border: 1px solid rgba(255,255,255,.82); border-radius: 14px; background: rgba(255,255,255,.52); box-shadow: 0 7px 15px rgba(40,66,119,.06), inset 0 1px 0 rgba(255,255,255,.7); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); color: var(--ink); text-align: left; font-size: 15px; font-weight: 620; }
      .slot[aria-pressed="true"] { color: var(--cian-strong); border-color: rgba(0,84,253,.42); background: rgba(234,240,255,.68); }
      .consent { display: flex; align-items: flex-start; gap: 11px; margin-top: 21px; padding: 14px; border: 1px solid rgba(255,255,255,.68); border-radius: 16px; color: #4f5a55; background: rgba(255,255,255,.38); box-shadow: inset 0 1px 0 rgba(255,255,255,.7); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font-size: 13px; line-height: 1.42; }
      .consent input { width: 21px; height: 21px; flex: 0 0 21px; margin: 0; accent-color: var(--cian); }
      .consent a { color: var(--cian-strong); text-decoration: none; }
      .footer { padding: 14px 20px max(20px, env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(246,249,255,0), rgba(255,255,255,.52) 22%); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
      .actions { display: grid; gap: 9px; }
      .primary { min-height: 54px; width: 100%; border: 0; border-radius: 16px; background: var(--cian); color: #fff; font-size: 16px; font-weight: 700; box-shadow: 0 7px 17px rgba(0,84,253,.2); }
      .primary:hover { background: var(--cian-strong); }
      .primary:active { transform: scale(.985); }
      .primary:disabled { opacity: .78; cursor: wait; }
      .secondary { min-height: 34px; border: 0; background: transparent; color: #59635f; font-size: 14px; }
      .back { min-height: 42px; border: 0; background: transparent; color: #59635f; font-size: 14px; text-align: left; padding: 0; }
      .legal { color: var(--muted); font-size: 12px; text-align: center; line-height: 1.35; margin: 0; }
      .success { display: grid; place-content: center; flex: 1; text-align: center; padding: 12px 8px 44px; }
      .success-mark { width: 84px; height: 84px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 30px; background: var(--cian-soft); color: var(--cian-strong); font-size: 38px; font-weight: 800; transform: rotate(-8deg); animation: successStamp 700ms cubic-bezier(.2,1.3,.2,1) both; }
      @keyframes successStamp { 0% { opacity: 0; transform: rotate(-18deg) scale(.45); box-shadow: 0 0 0 0 rgba(0,84,253,.26); } 58% { opacity: 1; transform: rotate(-5deg) scale(1.08); box-shadow: 0 0 0 16px rgba(0,84,253,0); } 100% { transform: rotate(-8deg) scale(1); box-shadow: 0 0 0 22px rgba(0,84,253,0); } }
      .success p { margin: 13px auto 0; max-width: 330px; color: var(--muted); line-height: 1.48; }
      .call-summary { margin-top: 24px; padding: 16px; border: 1px solid rgba(255,255,255,.82); border-radius: 18px; background: rgba(243,246,255,.58); box-shadow: 0 8px 20px rgba(40,66,119,.08), inset 0 1px 0 rgba(255,255,255,.78); backdrop-filter: blur(17px); -webkit-backdrop-filter: blur(17px); color: #34528f; text-align: left; }
      .call-summary small { color: var(--muted); }
      .call-summary b { display: block; margin-top: 5px; color: var(--ink); }
      .finance-island { margin-top:14px; animation:resultIn 260ms cubic-bezier(.2,.9,.2,1); }
      /* Solid bento mode: intentional blocks, no frosted or transparent surfaces. */
      body { color:#f8f8f6; background:#f17c56; }
      .stage { background:radial-gradient(circle at 88% 11%,#ffd24f 0 6rem,transparent 6.2rem),radial-gradient(circle at 8% 86%,#0054fd 0 9rem,transparent 9.2rem),#f17c56; }
      .stage::before, .stage::after { display:none; }
      .device { border:8px solid #151617; border-radius:38px; background:#151617; box-shadow:0 26px 56px rgba(46,25,20,.36); backdrop-filter:none; -webkit-backdrop-filter:none; }
      .topbar { background:#151617; border:0; backdrop-filter:none; -webkit-backdrop-filter:none; }
      .wordmark { color:#fff; }
      .source-pill { color:#151617; background:#f8f8f6; border:0; box-shadow:none; }
      .progress-label { color:#b7b8bd; }
      .progress { border:0; background:#303238; }
      .progress > span { background:#0054fd; }
      .footer { background:#151617; backdrop-filter:none; -webkit-backdrop-filter:none; }
      main { padding-top:20px; }
      .screen { color:#fff; }
      .eyebrow { color:#76a2ff; }
      h1, h2 { color:#fff; }
      .lead, .mini-benefit { color:#b9bbc1; }
      .quest-panel { border:0; border-radius:19px; background:#0054fd; box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none; }
      .quest-panel span, .quest-panel b { color:#fff; }
      .quest-track i { background:rgba(255,255,255,.34); }
      .quest-track i.is-done { background:#ffd54a; box-shadow:none; }
      .estimate { border:0; background:#ff835d; box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none; }
      .estimate small, .estimate p { color:#522115; }
      .estimate b { color:#151617; }
      .dot { background:#ffd54a; box-shadow:none; }
      .form { gap:10px; }
      .field { border:0; border-radius:20px; background:#f7f7f3; box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none; }
      .field label { color:#151617; }
      .field input { border:0; border-radius:12px; background:#e9e9e4; box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none; color:#151617; }
      .field input:focus { border:0; background:#fff; box-shadow:0 0 0 3px #0054fd; }
      .field input[readonly] { background:#dbdcd8; color:#5b5d60; }
      .hint { color:#606166; }
      .choices { gap:10px; }
      .choice { min-height:72px; border:0; border-radius:21px; box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none; }
      .choice:hover { transform:translateY(-2px) rotate(-.25deg); box-shadow:none; }
      .choices .choice:nth-child(4n + 1) { background:#ffd75a; }
      .choices .choice:nth-child(4n + 2) { background:#b7e7e6; }
      .choices .choice:nth-child(4n + 3) { background:#ffb2a0; }
      .choices .choice:nth-child(4n + 4) { background:#c9b9ff; }
      .choices .choice[aria-pressed="true"] { border:3px solid #0054fd; background:#f8f8f6; box-shadow:none; }
      .choice > span > strong, .choice > span > span { color:#151617; }
      .check { border-color:rgba(21,22,23,.24); background:rgba(255,255,255,.3); }
      .choice[aria-pressed="true"] .check { background:#0054fd; }
      .soft-note { border:0; border-radius:20px; color:#f6f6f2; background:#24262a; box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none; }
      /* The income picker behaves like a four-key amount pad, rather than a set of form controls. */
      .salary-selector { display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:124px 124px; gap:10px; margin-top:22px; }
      .salary-card { min-width:0; display:grid; grid-template-columns:auto 1fr; grid-template-rows:auto 1fr auto; column-gap:8px; text-align:left; padding:14px; border:0; border-radius:25px; color:#151617; background:#f7f7f3; overflow:hidden; position:relative; transition:transform 220ms cubic-bezier(.2,.9,.2,1), outline-color 180ms, filter 180ms; }
      .salary-card:nth-child(1) { grid-column:span 2; background:#ffd75a; }
      .salary-card:nth-child(2) { background:#b7e7e6; }
      .salary-card:nth-child(3) { background:#c9b9ff; }
      .salary-card:nth-child(4) { grid-column:span 2; background:#ffb2a0; }
      .salary-card::after { content:""; position:absolute; right:-20px; bottom:-24px; width:88px; height:88px; border:13px solid rgba(21,22,23,.12); border-radius:50%; }

  <body>

    <script>
      const state = {
        step: 0,
        name: '', email: 'ilya@example.com', phone: '+7 900 555-21-20',
        timing: '', object: '', consultant: '', income: '', hasDebts: '', debtPayment: '',
        day: '', slot: '', marketing: false, showErrors: false, transition: 'forward', submitting: false,
        viewedSteps: new Set(), resultTracked: false
      };
      const totalSteps = 5;
      // TODO: заменить на реальный номер счётчика перед подключением Яндекс Метрики.
      const METRIKA_COUNTER_ID = 00000000;
      const stepNames = ['entry', 'timing', 'object', 'finance', 'call_time', 'contacts', 'success'];
      const content = document.getElementById('content');
      const footer = document.getElementById('footer');
      const progressBar = document.getElementById('progressBar');
      const stepCount = document.getElementById('stepCount');
      const stepLabel = document.getElementById('stepLabel');
      const progressWrap = document.getElementById('progressWrap');
      const todayParts = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone:'Europe/Berlin', year:'numeric', month:'numeric', day:'numeric' }).formatToParts(new Date()).map(part => [part.type, part.value]));
      const days = Array.from({length:3}, (_, index) => {
        const date = new Date(Date.UTC(Number(todayParts.year), Number(todayParts.month) - 1, Number(todayParts.day) + index, 12));
        return { label:index === 0 ? 'Сегодня' : index === 1 ? 'Завтра' : new Intl.DateTimeFormat('ru-RU', {weekday:'long',timeZone:'UTC'}).format(date), date:new Intl.DateTimeFormat('ru-RU', {day:'numeric',month:'long',timeZone:'UTC'}).format(date) };
      });
      const slots = ['10:00–12:00', '12:00–15:00', '18:00–21:00'];
      const timingOptions = [
        { value: 'month', label: 'В течение месяца', short: 'До месяца', title: 'Скоро — значит, по делу', note: 'Эксперт поможет разобраться с ближайшими шагами.' },
        { value: 'quarter', label: 'Через 1–3 месяца', short: '1–3 месяца', title: 'Есть время всё взвесить', note: 'Разберём варианты и спокойно подготовимся к покупке.' },
        { value: 'half', label: 'Через 3–6 месяцев', short: '3–6 месяцев', title: 'Начнём с хорошего плана', note: 'Поймём, что можно подготовить заранее.' },
        { value: 'explore', label: 'Пока изучаю', short: 'Пока изучаю', title: 'Любопытство — уже начало', note: 'Поможем понять возможности. Без обязательств.' }

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      let entryLeaving = false;

      function reachGoal(name, params = {}) {
        const payload = { step: stepNames[state.step], step_number: state.step, ...params };
        if (typeof window.ym === 'function') window.ym(METRIKA_COUNTER_ID, 'reachGoal', name, payload);
        // Заглушка для локальной разработки: событие видно в DevTools без подключения счётчика.
        console.info('[metrika goal]', name, payload);
      }

      function trackStepView() {
        if (state.viewedSteps.has(state.step)) return;
        state.viewedSteps.add(state.step);
        reachGoal('mortgage_short_form_step_view');
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
      }
      function choice(label, value, selected, note = '') {
        return `<button class="choice" type="button" data-choice="${value}" aria-pressed="${selected}"><span><strong>${label}</strong>${note ? `<span>${note}</span>` : ''}</span><i class="check" aria-hidden="true">✓</i></button>`;
      }
      function chip(label, value, selected) {
        return `<button class="chip" type="button" data-chip="${value}" aria-pressed="${selected}">${label}</button>`;
      }
      function validate() {
        if (state.step === 5) {
          const nameOk = state.name.trim().split(/\s+/).filter(Boolean).length >= 2;
          const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email);
          return nameOk && emailOk;
        }
        if (state.step === 1) return Boolean(state.timing);
        if (state.step === 2) return Boolean(state.object) && (state.object === 'yes' || Boolean(state.consultant));
        if (state.step === 3) return Boolean(state.income) && Boolean(state.hasDebts) && (state.hasDebts === 'no' || Number(state.debtPayment.replace(/\s/g,'')) > 0);
        if (state.step === 4) return Boolean(state.day && state.slot);
        return true;
      }
      function updateProgress() {
        if (state.step === 0 || state.step === 6) { progressWrap.style.visibility = 'hidden'; return; }
        progressWrap.style.visibility = 'visible';
        const shown = state.step;
        progressBar.style.width = `${(shown / totalSteps) * 100}%`;
        progressBar.parentElement.setAttribute('aria-valuenow', String(shown));
        stepCount.textContent = `${shown} из ${totalSteps}`;
        stepLabel.textContent = state.step === 0 ? 'Короткая заявка' : 'Анкета для эксперта';
      }
      function render() {
        window.cancelAnimationFrame(welcomeFrame);
        entryLeaving = false;
        const device = document.querySelector('.device');
        device.classList.toggle('is-entry', state.step === 0);
        device.classList.add('is-opening');
        device.classList.toggle('is-form', state.step > 0 && state.step < 6);
        device.classList.toggle('is-success', state.step === 6);
        document.querySelector('.source-pill').textContent = state.step === 0 ? 'Ипотека' : 'Короткая заявка';
        updateProgress();
        trackStepView();
        let html = '';
        let actions = '';
        if (state.step === 0) {
          html = `<section class="screen welcome-screen">
            <p class="welcome-kicker"><span class="welcome-spark" aria-hidden="true">✳</span> Привет. Начнём с вашего будущего</p>

            <div class="calculation-stack">
              <button type="button" class="calculation-card" id="startCalculation" aria-label="Ваш расчёт: от 62 400 рублей в месяц. Продолжить подбор ипотеки">
                <span class="calculation-top"><span>Ваш расчёт<span class="calculation-overline">Ежемесячный платёж от</span></span><span class="calculation-saved" aria-hidden="true">↗</span></span>
                <span class="calculation-value" aria-hidden="true"><b id="paymentAmount">62 400</b><span class="rouble">₽</span></span>
                <span class="calculation-period" aria-hidden="true">в месяц. И целый дом впереди.</span>
                <span class="calculation-journey" aria-hidden="true">
                  <svg viewBox="0 0 304 142" fill="none">
                    <path class="journey-grid" d="M18 18V114M143 18V114M284 18V114M18 114H284" />
                    <path class="journey-guide" d="M18 102C66 102 83 38 143 38S236 62 284 18" />
                    <path id="calculationCurve" class="journey-curve" pathLength="1" d="M18 102C66 102 83 38 143 38S236 62 284 18" />
                    <circle class="journey-station" cx="18" cy="102" r="3" /><circle class="journey-station" cx="143" cy="38" r="3" />
                    <g class="journey-home"><circle cx="284" cy="18" r="17" /><path d="M276 18L284 11L292 18M278 17V25H290V17M282 25V20H286V25" /></g>
                    <circle id="calculationMarker" class="journey-marker" cx="284" cy="18" r="6" />
                    <text x="18" y="137">Расчёт</text><text x="143" y="137" text-anchor="middle">Подбор</text><text x="284" y="137" text-anchor="end">Ваш дом</text>
                  </svg>
                </span>
                <span class="calculation-action"><span>Найдём вашу ипотеку</span><span class="calculation-arrow" aria-hidden="true">↗</span></span>
              </button>
            </div>
            <p class="entry-detail"><span>5 коротких шагов</span><span>2 минуты</span><span>Без документов</span></p>
            <p class="entry-reassurance">Предварительный расчёт. Условия и решение банка могут отличаться.</p>
          </section>`;
          actions = '';
        }
        if (state.step === 1) {
          const selectedTiming = timingOptions.find(option => option.value === state.timing);
          html = `<section class="screen timing-screen"><p class="eyebrow">01 / Ваш план</p><h2>Свой дом.<br><span>В своё время.</span></h2><p class="lead">Когда вы хотели бы купить квартиру?</p>
            <div class="timing-panel" data-choice-group="timing"><div class="timing-panel-top"><span>Ваш горизонт покупки</span><b>Выберите касанием ↓</b></div><div class="timing-chart">${timingOptions.map((option, index) => `<button type="button" class="timing-option" data-choice="${option.value}" aria-label="${option.label}" aria-pressed="${state.timing === option.value}"><span class="timing-bar"><i aria-hidden="true">${state.timing === option.value ? '✓' : String(index + 1).padStart(2, '0')}</i></span><b>${option.short}</b></button>`).join('')}</div>
              <div class="timing-response" id="timingResponse" role="status"><span class="response-icon" aria-hidden="true">↗</span><div><strong>${selectedTiming?.title || 'В каком ритме движемся?'}</strong><p>${selectedTiming?.note || 'Любой ответ подойдёт. Даже если вы только присматриваетесь.'}</p></div></div>
            </div><p class="timing-caption">Можно вернуться и изменить ответ</p>${state.showErrors ? '<div class="error" role="alert">Выберите подходящий срок покупки</div>' : ''}</section>`;
          actions = navActions('Продолжить');

          reachGoal('mortgage_short_form_option_selected', { field: 'income', value: state.income });
        }));
        document.querySelectorAll('[data-day]').forEach(button => button.addEventListener('click', () => {
          if (state.day === button.dataset.day) return;
          state.day = button.dataset.day;
          state.slot = '';
          setPressed('day', state.day);
          clearStepError();
          updateQuestPanel();
          renderScheduleSlots();
          updateCallPreview();
          reachGoal('mortgage_short_form_option_selected', { field: 'call_day', value: state.day });
        }));
        bindObjectSwipe();
        const marketing = document.getElementById('marketing');
        if (marketing) marketing.addEventListener('change', e => { state.marketing = e.target.checked; reachGoal('mortgage_short_form_optional_consent', { enabled: state.marketing }); });
        const back = document.getElementById('back');
        if (back) back.addEventListener('click', () => { if (state.submitting) return; reachGoal('mortgage_short_form_back'); state.showErrors = false; state.transition = 'back'; state.step--; render(); });
        const next = document.getElementById('next');
        if (next) next.addEventListener('click', () => {
          if (state.submitting) return;
          if (!validate()) { reachGoal('mortgage_short_form_validation_error'); showFieldErrors(); return; }
          state.showErrors = false;
          state.transition = 'forward';
          if (state.step === 0) reachGoal('mortgage_short_form_start');
          else reachGoal('mortgage_short_form_step_complete');
          if (state.step === 5) {
            reachGoal('mortgage_short_form_submit');
            state.submitting = true;
            next.disabled = true;
            next.setAttribute('aria-busy', 'true');
            next.textContent = 'Передаём заявку…';
            if (back) back.disabled = true;
            window.setTimeout(() => { state.submitting = false; state.step = 6; reachGoal('mortgage_short_form_success'); render(); }, 650);
            return;
          }
          state.step++;
          render();
        });
        const restart = document.getElementById('restart');
        if (restart) restart.addEventListener('click', () => { Object.assign(state, { step: 0, name: '', email: 'ilya@example.com', timing: '', object: '', consultant: '', income: '', hasDebts: '', debtPayment: '', day: '', slot: '', marketing: false, showErrors: false, transition: 'back', submitting: false, viewedSteps: new Set(), resultTracked: false }); render(); });
      }
      render();
    </script>
  </body>
</html>
